[package]
name = "streamforge-load"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
tokio = { version = "1.35", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bin]]
name = "ad_event_server"
path = "src/ad_event_server.rs"

[[bin]]
name = "price_event_server"
path = "src/price_event_server.rs"

[[bin]]
name = "simple_counter_server"
path = "src/simple_counter_server.rs"
