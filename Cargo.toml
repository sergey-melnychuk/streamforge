[package]
name = "streamforge"
version = "0.1.0"
edition = "2021"
authors = ["Sergey Melnychuk"]
description = "Ultra-fast, distributed stream processing engine"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sergey-melnychuk/streamforge"
keywords = ["stream-processing", "distributed", "real-time", "event-streaming"]
categories = ["concurrency", "database", "network-programming"]

[features]
default = []
vault = []
aws-secrets = []
rocksdb = ["dep:rocksdb"]

[lib]
name = "streamforge"
path = "src/lib.rs"

[[bin]]
name = "streamforge"
path = "src/bin/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"

# Concurrent data structures
crossbeam = "0.8"
dashmap = "5.5"
parking_lot = "0.12"

# Serialization
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
bytes = "1.5"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "tracing-log"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"
async-trait = "0.1"

# Metrics
prometheus = "0.13"

# Time utilities
chrono = "0.4"

# System info
num_cpus = "1.16"

# JSON support
serde_json = "1.0"

# TOML support for configuration
toml = "0.8"

# Random number generation
rand = "0.8"

# RocksDB for persistent state storage (optional, gated behind "rocksdb" feature)
rocksdb = { version = "0.21", optional = true }

# HTTP client for sources
reqwest = { version = "0.11", features = ["json"] }

# HTTP server (axum)
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["trace"] }

# TLS/SSL support
rustls = "0.21"
tokio-rustls = "0.24"
rustls-pemfile = "1.0"
rustls-native-certs = "0.6"

# Cryptography for authentication
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"

# CLI framework
clap = { version = "4.4", features = ["derive"] }
dirs = "5.0"
uuid = { version = "1.6", features = ["v4", "serde"] }

[dev-dependencies]
criterion = { version = "0.7", features = ["async", "async_tokio", "html_reports"] }
proptest = "1.4"
tokio-test = "0.4"
tempfile = "3.8"

[[bench]]
name = "throughput"
harness = false

[[bench]]
name = "latency"
harness = false

[profile.release]
opt-level = 3
#lto = true
#codegen-units = 1
panic = "abort"

[profile.bench]
inherits = "release"

[profile.dev]
opt-level = 0

[profile.test]
opt-level = 1
